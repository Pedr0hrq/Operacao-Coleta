<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Operação Coleta - ODS 11</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #87CEEB;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Fredoka', Arial, sans-serif;
            touch-action: none;
        }
        #gameWrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        #gameWrapper:fullscreen {
            background-color: #102027;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            background-color: #e0f7fa;
            border: 3px solid #006064;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
            max-width: 98vw;
            max-height: 96vh;
            aspect-ratio: 800 / 450;
        }
        #gameWrapper:fullscreen canvas {
            width: auto;
            height: auto;
            max-width: 100vw;
            max-height: 100vh;
        }
        /* Botão compacto de tela cheia no canto inferior esquerdo */
        #fullscreenBtn {
            position: fixed;
            bottom: 8px;
            left: 8px;
            z-index: 25;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 7px;
            font-family: 'Fredoka', Arial, sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            background-color: rgba(0, 96, 100, 0.85);
            border: 2px solid #141414;
            border-radius: 7px;
            cursor: pointer;
            text-shadow: 0 1px 0 #141414;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            line-height: 1;
        }
        #fullscreenBtn:hover {
            background-color: #00838f;
        }
        #fullscreenBtn svg {
            width: 14px;
            height: 14px;
            stroke: #ffffff;
            stroke-width: 2.3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: block;
        }
        /* Aba/modal para digitar o apelido com o azul clarinho original */
        #nicknameModal {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        #nicknameBox {
            background: #e0f7fa;
            border: 4px solid #141414;
            border-radius: 18px;
            padding: 22px 26px;
            width: 320px;
            max-width: 85vw;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
        }
        #nicknameTitle {
            margin: 0 0 14px 0;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            -webkit-text-stroke: 1.5px #1b1b1b;
            text-shadow: 0 2px 0 #1b1b1b;
            letter-spacing: 0.5px;
        }
        #nicknameInput {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            font-family: 'Fredoka', Arial, sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #006064;
            background: #ffffff;
            border: 3px solid #00838f;
            border-radius: 10px;
            text-align: center;
            outline: none;
            margin-bottom: 16px;
        }
        #nicknameInput:focus {
            border-color: #006064;
            box-shadow: 0 0 0 3px rgba(0, 131, 143, 0.25);
        }
        .nicknameActions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .nickBtn {
            flex: 1;
            padding: 9px 12px;
            font-family: 'Fredoka', Arial, sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            border: 2.5px solid #1b1b1b;
            border-radius: 10px;
            cursor: pointer;
            text-shadow: 0 1.5px 0 #1b1b1b;
        }
        #saveNicknameBtn {
            background-color: #66bb6a;
        }
        #saveNicknameBtn:hover {
            background-color: #4caf50;
        }
        #cancelNicknameBtn {
            background-color: #ef5350;
        }
        #cancelNicknameBtn:hover {
            background-color: #e53935;
        }
    </style>
</head>
<body>

<div id="gameWrapper">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <button type="button" id="fullscreenBtn" title="Tela Cheia [F]" aria-label="Tela Cheia">
        <span id="fullscreenIcon"></span>
        <span>F</span>
    </button>

    <div id="nicknameModal">
        <div id="nicknameBox">
            <h3 id="nicknameTitle">Escolha seu Apelido</h3>
            <input type="text" id="nicknameInput" maxlength="16" placeholder="Ex: cachorrinho">
            <div class="nicknameActions">
                <button type="button" id="cancelNicknameBtn" class="nickBtn">Cancelar</button>
                <button type="button" id="saveNicknameBtn" class="nickBtn">Salvar</button>
            </div>
        </div>
    </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', function () {
    const gameWrapper = document.getElementById('gameWrapper');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
    if (!canvas || !ctx) return;

    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fullscreenIcon = document.getElementById('fullscreenIcon');
    const nicknameModal = document.getElementById('nicknameModal');
    const nicknameTitle = document.getElementById('nicknameTitle');
    const nicknameInput = document.getElementById('nicknameInput');
    const saveNicknameBtn = document.getElementById('saveNicknameBtn');
    const cancelNicknameBtn = document.getElementById('cancelNicknameBtn');

    // Azul clarinho original do jogo para os painéis/janelas
    const MODAL_BG_BLUE = '#e0f7fa';

    const EXPAND_SVG = '<svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>';
    const COLLAPSE_SVG = '<svg viewBox="0 0 24 24"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>';

    function safeStorageGet(key, fallback = '') {
        try {
            const val = localStorage.getItem(key);
            return val !== null ? val : fallback;
        } catch (e) {
            return fallback;
        }
    }

    function safeStorageSet(key, value) {
        try {
            localStorage.setItem(key, String(value));
        } catch (e) {
            // ignora bloqueio de storage
        }
    }

    // Idiomas suportados: 'pt', 'en', 'es'
    let currentLang = safeStorageGet('operacaoColetaLang', 'pt');
    if (!['pt', 'en', 'es'].includes(currentLang)) {
        currentLang = 'pt';
    }

    const I18N = {
        pt: {
            pageTitle: "Operação Coleta - ODS 11",

            tutorialRule2: "2. Acerte para ganhar +50 pontos. Errar ou deixar cair tira 1 vida!",
            tutorialLives: "Você começa com 3 vidas:",
            skipTutorial: "Pular  >>",
            backToMenu: "Voltar ao Menu",

            livesLabel: "Vidas",
            pausedTitle: "PAUSADO",
            resumeGame: "Voltar ao Jogo",
            mainMenu: "Menu Principal",
            quitConfirm1: "Você realmente quer sair da partida",
            quitConfirm2: "e voltar ao menu principal?",
            yes: "Sim",
            no: "Não",
            gameOverTitle: "FIM DE JOGO",
            playerLabel: "Jogador",
            pointsLabel: "Pontos",
            highScoreLabel: "Seu Recorde",
            playAgain: "Jogar Novamente",
            settingsTitle: "CONFIGURAÇÕES",
            languageLabel: "Idioma / Language / Idioma",
            langPt: "Português",
            langEn: "Inglês",
            langEs: "Espanhol",
            close: "Fechar",
            types: {
                'Plástico':   'Plástico',
                'Metal':      'Metal',
                'Vidro':      'Vidro',
                'Papel':      'Papel',
                'Orgânico':   'Orgânico',
                'Eletrônico': 'Eletrônico'
            }
        },
        en: {
            pageTitle: "Collection Operation - SDG 11",
            fullscreenOpen: "Fullscreen [F]",
            fullscreenClose: "Exit Fullscreen [F]",
            loadingLabel: "Loading",
            nicknameTitle: "Choose your Nickname",
            nicknamePlaceholder: "Ex: little_dog",
            defaultNicknameBtn: "Nickname",
            save: "Save",
            cancel: "Cancel",
            gameTitleFallback: "COLLECTION OPERATION",
            playFallback: "PLAY",

            tutorialRule1: "1. Trash falls from above: drag each item to the matching bin!",
            tutorialRule2: "2. Match right for +50 pts. Mistakes or misses cost 1 life!",
            tutorialLives: "You start with 3 lives:",
            skipTutorial: "Skip  >>",
            backToMenu: "Back to Menu",
            scoreLabel: "Score",
            livesLabel: "Lives",
            pausedTitle: "PAUSED",
            resumeGame: "Resume Game",
            mainMenu: "Main Menu",
            quitConfirm1: "Do you really want to quit the match",
            quitConfirm2: "and return to the main menu?",
            yes: "Yes",
            no: "No",
            gameOverTitle: "GAME OVER",
            playerLabel: "Player",
            pointsLabel: "Score",
            highScoreLabel: "Your Best",
            playAgain: "Play Again",
            settingsTitle: "SETTINGS",
            languageLabel: "Language",
            langPt: "Portuguese",
            langEn: "English",
            langEs: "Spanish",
            close: "Close",
            types: {
                'Plástico':   'Plastic',
                'Metal':      'Metal',
                'Vidro':      'Glass',
                'Papel':      'Paper',

                'Eletrônico': 'E-Waste'
            }
        },
        es: {
            pageTitle: "Operación Colecta - ODS 11",
            fullscreenOpen: "Pantalla Completa [F]",
            fullscreenClose: "Salir de Pantalla Completa [F]",
            loadingLabel: "Cargando",
            nicknameTitle: "Elige tu Apodo",
            nicknamePlaceholder: "Ej: perrito",
            defaultNicknameBtn: "Apodo",
            save: "Guardar",
            cancel: "Cancelar",
            gameTitleFallback: "OPERACIÓN COLECTA",
            playFallback: "JUGAR",
            rankingFallback: "TOP",
            recordLabel: "Tu Récord",
            tutorialTitle: "CÓMO JUGAR",
            tutorialRule1: "1. La basura cae del cielo: ¡arrastra cada ítem al contenedor correcto!",
            tutorialRule2: "2. Acierta para ganar +50 pts. ¡Fallar o dejar caer quita 1 vida!",
            tutorialLives: "Empiezas con 3 vidas:",
            skipTutorial: "Saltar  >>",
            backToMenu: "Volver al Menú",
            scoreLabel: "Puntaje",
            livesLabel: "Vidas",
            pausedTitle: "PAUSADO",
            resumeGame: "Volver al Juego",
            mainMenu: "Menú Principal",
            quitConfirm1: "¿Realmente quieres salir de la partida",
            quitConfirm2: "y volver al menú principal?",
            yes: "Sí",
            no: "No",
            gameOverTitle: "FIN DEL JUEGO",
            playerLabel: "Jugador",
            pointsLabel: "Puntos",
            highScoreLabel: "Tu Récord",
            playAgain: "Jugar de Nuevo",
            settingsTitle: "CONFIGURACIÓN",
            languageLabel: "Idioma",
            langPt: "Portugués",
            langEn: "Inglés",
            langEs: "Español",
            close: "Cerrar",
            types: {
                'Plástico':   'Plástico',
                'Metal':      'Metal',
                'Vidro':      'Vidrio',
                'Papel':      'Papel',
                'Orgânico':   'Orgánico',
                'Eletrônico': 'Electrónico'
            }
        }
    };

    function t(key) {
        return (I18N[currentLang] && I18N[currentLang][key]) || I18N.pt[key] || key;
    }

    function getTypeLabel(internalType) {
        return (I18N[currentLang] && I18N[currentLang].types && I18N[currentLang].types[internalType]) || internalType;
    }

    function getPlayButtonAsset() {
        if (currentLang === 'en') return menuImages.jogar_en;
        if (currentLang === 'es') return menuImages.jogar_es;
        return menuImages.jogar;
    }

    function updateFullscreenButtonLabel() {
        if (!fullscreenBtn) return;
        const isFull = !!document.fullscreenElement;
        const label = isFull ? t('fullscreenClose') : t('fullscreenOpen');
        fullscreenBtn.title = label;
        fullscreenBtn.setAttribute('aria-label', label);
        if (fullscreenIcon) {
            fullscreenIcon.innerHTML = isFull ? COLLAPSE_SVG : EXPAND_SVG;
        }
    }

    function applyLanguageToDOM() {
        document.title = t('pageTitle');
        document.documentElement.lang = currentLang === 'pt' ? 'pt-BR' : currentLang;
        if (nicknameTitle) nicknameTitle.textContent = t('nicknameTitle');
        if (nicknameInput) nicknameInput.placeholder = t('nicknamePlaceholder');
        if (saveNicknameBtn) saveNicknameBtn.textContent = t('save');
        if (cancelNicknameBtn) cancelNicknameBtn.textContent = t('cancel');
        updateFullscreenButtonLabel();
    }

    function setLanguage(langCode) {
        if (!I18N[langCode]) return;
        currentLang = langCode;
        safeStorageSet('operacaoColetaLang', currentLang);
        applyLanguageToDOM();
    }

    async function toggleFullscreen() {
        try {
            if (!document.fullscreenElement) {
                if (gameWrapper && gameWrapper.requestFullscreen) {
                    await gameWrapper.requestFullscreen();
                } else if (canvas.requestFullscreen) {
                    await canvas.requestFullscreen();
                }
            } else if (document.exitFullscreen) {
                await document.exitFullscreen();
            }
        } catch (err) {
            console.log('Não foi possível alternar tela cheia:', err);
        }
    }

    if (fullscreenBtn) {
        fullscreenBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            toggleFullscreen();
        });
    }

    document.addEventListener('fullscreenchange', updateFullscreenButtonLabel);

    // Estados: 'loading', 'menu', 'tutorial', 'playing', 'paused', 'gameover'
    let gameState = 'loading';
    let isSettingsOpen = false;
    let tutorialSource = 'fromMenu';
    let hasSeenTutorial = safeStorageGet('operacaoColetaTutorialSeen', 'false') === 'true';

    // Controle de carregamento de assets
    let totalAssetsCount = 0;
    let loadedAssetsCount = 0;
    let displayProgressPercent = 0;
    let assetsReady = false;
    let finishLoadingTimer = null;

    let isNicknameModalOpen = false;
    let isConfirmQuitOpen = false;
    let playerName = safeStorageGet('operacaoColetaPlayerName', '');
    let score = 0;
    let lives = 3;
    let spawnRate = 85;
    let frameCount = 0;
    let bgFrameCount = 0;
    let lastErrorMessage = '';

    const parsedHigh = parseInt(safeStorageGet('operacaoColetaHighScore', '0'), 10);
    let highScore = Number.isNaN(parsedHigh) ? 0 : parsedHigh;

    document.addEventListener('keydown', function (e) {
        const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
        if (activeTag === 'input' || activeTag === 'textarea' || isNicknameModalOpen) {
            return;
        }
        if (e.key === 'f' || e.key === 'F') {
            e.preventDefault();
            toggleFullscreen();
        } else if (e.key === 'Escape' && isSettingsOpen) {
            e.preventDefault();
            isSettingsOpen = false;
        }
    });

    // Botões do jogo
    const pauseBtn = { x: 15, y: 12, w: 40, h: 40 };
    const resumeBtn = { x: 265, y: 195, w: 270, h: 48 };
    const pauseMenuBtn = { x: 265, y: 260, w: 270, h: 48 };
    const confirmYesBtn = { x: 245, y: 262, w: 140, h: 48 };
    const confirmNoBtn  = { x: 415, y: 262, w: 140, h: 48 };
    const retryBtn = { x: 215, y: 310, w: 175, h: 44 };
    const gameOverMenuBtn = { x: 410, y: 310, w: 175, h: 44 };

    // Botão inferior do tutorial ("Pular >>" na 1ª vez ou "Voltar ao Menu" pelo menu)
    const tutorialActionBtn = { x: 295, y: 388, w: 210, h: 42 };

    // Botões médios de Tutorial e Ranking (64x64 px) e Configurações (54x54 px)
    const sideBtnSize = 64;
    const sideBtnX = 785 - sideBtnSize;
    const menuTutorialBtnRect = { x: sideBtnX, y: 86,  w: sideBtnSize, h: sideBtnSize };
    const menuRankingBtnRect  = { x: sideBtnX, y: 158, w: sideBtnSize, h: sideBtnSize };

    const squareBtnSize = 54;
    const menuConfigBtnRect   = { x: 15, y: 450 - 15 - squareBtnSize, w: squareBtnSize, h: squareBtnSize };

    // Botões dentro do modal de Configurações
    const settingsBoxRect = { x: 210, y: 85, w: 380, h: 280 };
    const langPtBtn = { x: 255, y: 162, w: 290, h: 38 };
    const langEnBtn = { x: 255, y: 208, w: 290, h: 38 };
    const langEsBtn = { x: 255, y: 254, w: 290, h: 38 };
    const closeSettingsBtn = { x: 315, y: 306, w: 170, h: 40 };

    const trashHighlightColors = {
        'Orgânico':   '#8D6E63',
        'Plástico':   '#E53935',
        'Papel':      '#1E88E5',
        'Vidro':      '#43A047',
        'Metal':      '#FDD835',
        'Eletrônico': '#FB8C00'
    };

    const binW = 85;
    const binH = 115;
    const binY = 325;

    const bins = [
        { type: 'Plástico',   baseName: 'lixeira_plastico',   x: 41,  y: binY, w: binW, h: binH },
        { type: 'Metal',      baseName: 'lixeira_metal',      x: 168, y: binY, w: binW, h: binH },
        { type: 'Vidro',      baseName: 'lixeira_vidro',      x: 294, y: binY, w: binW, h: binH },
        { type: 'Papel',      baseName: 'lixeira_papel',      x: 421, y: binY, w: binW, h: binH },
        { type: 'Orgânico',   baseName: 'lixeira_organico',   x: 547, y: binY, w: binW, h: binH },
        { type: 'Eletrônico', baseName: 'lixeira_eletronico', x: 674, y: binY, w: binW, h: binH }
    ];

    const trashTypes = [
        { type: 'Plástico',   baseName: 'plastico' },
        { type: 'Metal',      baseName: 'metal' },
        { type: 'Vidro',      baseName: 'vidro' },
        { type: 'Papel',      baseName: 'papel' },
        { type: 'Orgânico',   baseName: 'organico' },
        { type: 'Eletrônico', baseName: 'eletronico' }
    ];

    const menuAssetsConfig = [
        { key: 'fundo',    candidates: ['fundo_jogo'] },
        { key: 'logo',     candidates: ['logo_menu'] },
        { key: 'apelido',  candidates: ['bnt_apelido', 'btn_apelido'] },
        { key: 'ranking',  candidates: ['btn_ranking'] },
        { key: 'tutorial', candidates: ['btn_tutorial'] },
        { key: 'config',   candidates: ['btn_config'] },
        { key: 'jogar',    candidates: ['btn_jogar'] },
        { key: 'jogar_en', candidates: ['btn_jogar_en', 'btn_play'] },
        { key: 'jogar_es', candidates: ['btn_jogar_es', 'btn_jugar'] },
        { key: 'coracao',  candidates: ['coracao'] }
    ];

    let trashImages = {};
    let binImages = {};
    let menuImages = {};

    let menuHitboxes = {
        apelido: null,
        tutorial: menuTutorialBtnRect,
        ranking: menuRankingBtnRect,
        config: menuConfigBtnRect,
        jogar: null
    };

    function markAssetLoaded() {
        loadedAssetsCount = Math.min(totalAssetsCount, loadedAssetsCount + 1);
        if (loadedAssetsCount >= totalAssetsCount) {
            assetsReady = true;
        }
    }

    function loadAssetCandidates(candidates, onReady) {
        const list = Array.isArray(candidates) ? candidates : [candidates];
        let nameIdx = 0;
        let finished = false;

        function finishOnce(imgOrNull) {
            if (finished) return;
            finished = true;
            try {
                onReady(imgOrNull);
            } finally {
                markAssetLoaded();
            }
        }

        function tryName() {
            if (nameIdx >= list.length) {
                finishOnce(null);
                return;
            }

            const baseName = list[nameIdx];
            nameIdx++;

            try {
                const imgPng = new Image();
                imgPng.onload = function() { finishOnce(imgPng); };
                imgPng.onerror = function() {
                    try {
                        const imgJpg = new Image();
                        imgJpg.onload = function() { finishOnce(imgJpg); };
                        imgJpg.onerror = function() { tryName(); };
                        imgJpg.src = baseName + '.jpg';
                    } catch (e) {
                        tryName();
                    }
                };
                imgPng.src = baseName + '.png';
            } catch (e) {
                tryName();
            }
        }

        tryName();
    }

    function preloadImages() {
        const allTasks = [];

        trashTypes.forEach(item => {
            allTasks.push(() => {
                loadAssetCandidates([item.baseName], (img) => { trashImages[item.type] = img; });
            });
        });

        bins.forEach(bin => {
            allTasks.push(() => {
                loadAssetCandidates([bin.baseName], (img) => { binImages[bin.type] = img; });
            });
        });

        menuAssetsConfig.forEach(asset => {
            allTasks.push(() => {
                loadAssetCandidates(asset.candidates, (img) => { menuImages[asset.key] = img; });
            });
        });

        totalAssetsCount = allTasks.length;
        loadedAssetsCount = 0;
        displayProgressPercent = 0;
        assetsReady = totalAssetsCount === 0;

        if (assetsReady) {
            displayProgressPercent = 100;
            gameState = 'menu';
            return;
        }

        allTasks.forEach(task => task());

        // Salvaguarda caso alguma conexão caia ou demore demais
        setTimeout(() => {
            if (gameState === 'loading') {
                assetsReady = true;
            }
        }, 8000);
    }

    function isImgReady(img) {
        return Boolean(img && img.complete && img.naturalWidth > 0 && img.naturalHeight > 0);
    }

    function drawGameBackground() {
        const bgImg = menuImages.fundo;
        if (isImgReady(bgImg)) {
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        } else {
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#64b5f6');
            grad.addColorStop(1, '#e0f7fa');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    }

    function openNicknameModal() {
        if (!nicknameModal || !nicknameInput) return;
        isNicknameModalOpen = true;
        applyLanguageToDOM();
        nicknameInput.value = playerName;
        nicknameModal.style.display = 'flex';
        setTimeout(() => nicknameInput.focus(), 30);
    }

    function closeNicknameModal() {
        isNicknameModalOpen = false;

    function drawCartoonText(text, x, y, options = {}) {
        const {
            fontSize = 22,
            fillColor = '#ffffff',
            strokeColor = '#141414',
            strokeWidth = 5,
            align = 'center',
            baseline = 'alphabetic',
            maxWidth = undefined
        } = options;

        ctx.save();
        ctx.font = `700 ${fontSize}px 'Fredoka', Arial, sans-serif`;
        ctx.textAlign = align;
        ctx.textBaseline = baseline;
        ctx.lineJoin = 'round';
        ctx.miterLimit = 2;

        if (strokeWidth > 0) {
            ctx.lineWidth = strokeWidth;
            ctx.strokeStyle = strokeColor;
            if (maxWidth !== undefined) ctx.strokeText(text, x, y, maxWidth);
            else ctx.strokeText(text, x, y);
        }

        ctx.fillStyle = fillColor;
        if (maxWidth !== undefined) ctx.fillText(text, x, y, maxWidth);
        else ctx.fillText(text, x, y);
        ctx.restore();
    }

    function drawImageProportional(img, x, y, maxW, maxH, anchorX = 'left', anchorY = 'top', fallbackFn = null) {
        if (!isImgReady(img)) {
            let finalX = x;
            if (anchorX === 'center') finalX = x - maxW / 2;
            else if (anchorX === 'right') finalX = x - maxW;

            let finalY = y;
            if (anchorY === 'center') finalY = y - maxH / 2;
            else if (anchorY === 'bottom') finalY = y - maxH;

            if (fallbackFn) fallbackFn(finalX, finalY, maxW, maxH);
            return { x: finalX, y: finalY, w: maxW, h: maxH };
        }

        const ratio = img.naturalWidth / img.naturalHeight;
        let drawW = maxW;
        let drawH = drawW / ratio;

        if (drawH > maxH) {
            drawH = maxH;
            drawW = drawH * ratio;
        }

        let finalX = x;
        if (anchorX === 'center') finalX = x - drawW / 2;
        else if (anchorX === 'right') finalX = x - drawW;

        let finalY = y;
        if (anchorY === 'center') finalY = y - drawH / 2;
        else if (anchorY === 'bottom') finalY = y - drawH;

        ctx.drawImage(img, finalX, finalY, drawW, drawH);
        return { x: finalX, y: finalY, w: drawW, h: drawH };
    }

    function drawRoundRectSafe(x, y, w, h, r) {
        ctx.beginPath();
        if (typeof ctx.roundRect === 'function') {
            ctx.roundRect(x, y, w, h, r);
        } else {
            ctx.rect(x, y, w, h);
        }
    }

    function drawLoadingScreen() {
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#81d4fa');
        grad.addColorStop(1, '#e0f7fa');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const realPercent = totalAssetsCount > 0
            ? Math.round((loadedAssetsCount / totalAssetsCount) * 100)
            : 100;
        const targetPercent = assetsReady ? 100 : Math.min(99, Math.max(realPercent, displayProgressPercent + 1));

        if (displayProgressPercent < targetPercent) {
            displayProgressPercent += Math.max(1, Math.ceil((targetPercent - displayProgressPercent) * 0.2));
            if (displayProgressPercent > targetPercent) {
                displayProgressPercent = targetPercent;
            }
        }

        // Logo centralizada no meio e um pouquinho acima, ligeiramente maior que no menu
        drawImageProportional(
            menuImages.logo,
            400,
            175,
            330,
            205,
            'center',
            'center',
            (x, y, w, h) => {
                drawCartoonText(t('gameTitleFallback'), x + w / 2, y + h / 2, {
                    fontSize: 32,
                    fillColor: '#ffb300',
                    strokeColor: '#141414',
                    strokeWidth: 5.5,
                    align: 'center',
                    baseline: 'middle'
                });
            }
        );

        // Barra de carregamento abaixo da logo
        const barW = 420;
        const barH = 28;
        const barX = (canvas.width - barW) / 2;
        const barY = 308;

        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.14)';
        drawRoundRectSafe(barX + 2, barY + 4, barW, barH, 14);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#141414';
        ctx.lineWidth = 3.5;
        drawRoundRectSafe(barX, barY, barW, barH, 14);
        ctx.fill();
        ctx.stroke();

        const fillRatio = Math.max(0, Math.min(1, displayProgressPercent / 100));
        const innerPad = 4;
        const maxFillW = barW - innerPad * 2;
        const currentFillW = Math.round(maxFillW * fillRatio);

        if (currentFillW > 0) {
            const barGrad = ctx.createLinearGradient(0, barY, 0, barY + barH);
            barGrad.addColorStop(0, '#81c784');
            barGrad.addColorStop(1, '#43a047');
            ctx.fillStyle = barGrad;
            drawRoundRectSafe(barX + innerPad, barY + innerPad, currentFillW, barH - innerPad * 2, 10);
            ctx.fill();
        }
        ctx.restore();

        // Texto "Carregando" e porcentagem ao lado aumentando até 100%
        drawCartoonText(`${t('loadingLabel')} ${displayProgressPercent}%`, 400, 368, {
            fontSize: 23,
            fillColor: '#ffffff',
            strokeColor: '#141414',
            strokeWidth: 5,
            align: 'center',
            baseline: 'middle'
        });

        if (assetsReady && displayProgressPercent >= 100 && !finishLoadingTimer) {
            finishLoadingTimer = setTimeout(() => {
                gameState = 'menu';
            }, 200);
        }
    }

    function drawGearFallback(x, y, w, h) {
        const cx = x + w / 2;
        const cy = y + h / 2;
        const outerR = Math.min(w, h) * 0.40;
        const innerR = outerR * 0.68;
        const teeth = 8;

        ctx.save();
        ctx.fillStyle = '#90a4ae';
        ctx.strokeStyle = '#141414';
        ctx.lineWidth = 3;
        drawRoundRectSafe(x, y, w, h, 10);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        for (let i = 0; i < teeth * 2; i++) {
            const angle = (i * Math.PI) / teeth;
            const r = i % 2 === 0 ? outerR : innerR;
            const px = cx + Math.cos(angle) * r;
            const py = cy + Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = '#eceff1';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, outerR * 0.30, 0, Math.PI * 2);
        ctx.fillStyle = '#546e7a';
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    function drawLivesHUD() {
        const heartSize = 28;
        const gap = 6;
        const count = Math.max(0, lives);
        const totalHeartsWidth = count > 0 ? (count * heartSize) + ((count - 1) * gap) : 0;

        const rightMargin = 780;
        const heartsStartX = rightMargin - totalHeartsWidth;
        const centerY = 32;

        drawCartoonText(`${t('livesLabel')}:`, heartsStartX - 10, centerY, {
            fontSize: 19,
            fillColor: '#ffffff',
            strokeColor: '#141414',
            strokeWidth: 4,
            align: 'right',
            baseline: 'middle'
        });

        for (let i = 0; i < count; i++) {
            const hx = heartsStartX + i * (heartSize + gap);
            const hy = centerY - heartSize / 2;

            drawImageProportional(
                menuImages.coracao,
                hx + heartSize / 2,
                hy + heartSize / 2,
                heartSize,
                heartSize,
                'center',
                'center',
                (fx, fy, fw, fh) => {
                    ctx.save();
                    ctx.fillStyle = '#e53935';
                    ctx.strokeStyle = '#141414';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(fx + fw * 0.32, fy + fh * 0.35, fw * 0.25, 0, Math.PI * 2);
                    ctx.arc(fx + fw * 0.68, fy + fh * 0.35, fw * 0.25, 0, Math.PI * 2);
                    ctx.lineTo(fx + fw * 0.92, fy + fh * 0.45);
                    ctx.lineTo(fx + fw * 0.5, fy + fh * 0.92);
                    ctx.lineTo(fx + fw * 0.08, fy + fh * 0.45);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
            );
        }
    }

    function drawHeldTrashRing(item) {
        if (!item || !item.isDragging) return;

        const ringColor = trashHighlightColors[item.type] || '#ffffff';
        const radius = item.size * 0.62;

        ctx.save();
        ctx.beginPath();
        ctx.arc(item.x, item.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = ringColor + '33';
        ctx.fill();

        ctx.lineWidth = 5;
        ctx.strokeStyle = '#141414';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(item.x, item.y, radius, 0, Math.PI * 2);
        ctx.lineWidth = 3;
        ctx.strokeStyle = ringColor;
        ctx.stroke();
        ctx.restore();
    }

    let trashes = [];
    let bgTrashes = [];
    let draggedTrash = null;

    function createFallingItem(yPos = -40, speedMin = 1.2, speedMax = 2.6) {
        const randomType = trashTypes[Math.floor(Math.random() * trashTypes.length)];
        return {
            type: randomType.type,
            x: Math.random() * 700 + 50,
            y: yPos,
            size: 48,
            speed: speedMin + Math.random() * (speedMax - speedMin),
            isDragging: false
        };
    }

    function seedBackgroundTrashes() {
        bgTrashes = [];
        for (let i = 0; i < 6; i++) {
            bgTrashes.push(createFallingItem(Math.random() * 420, 1.2, 2.4));
        }
    }

    function updateDynamicBackground() {
        bgFrameCount++;
        if (bgFrameCount % 55 === 0) {
            bgTrashes.push(createFallingItem(-40, 1.3, 2.5));
        }

        for (let i = 0; i < bgTrashes.length; i++) {
            const item = bgTrashes[i];
            item.y += item.speed;

            const img = trashImages[item.type];
            if (isImgReady(img)) {
                ctx.drawImage(img, item.x - item.size / 2, item.y - item.size / 2, item.size, item.size);
            }

            if (item.y > canvas.height + 50) {
                bgTrashes.splice(i, 1);
                i--;
            }
        }
    }

    // Escada de velocidade por faixa de pontuação
    function getSpeedPool(currentScore) {
        if (currentScore < 5000) return [1];
        if (currentScore < 10000) return [2];
        if (currentScore < 15000) return [3];
        if (currentScore < 30000) return [4];
        if (currentScore < 50000) return [5];
        if (currentScore < 80000) return [6];
        if (currentScore < 100000) return [7];
        return [8];
    }

    function spawnTrash() {
        const randomType = trashTypes[Math.floor(Math.random() * trashTypes.length)];
        const allowedSpeeds = getSpeedPool(score);
        const selectedSpeed = allowedSpeeds[Math.floor(Math.random() * allowedSpeeds.length)];

        trashes.push({
            type: randomType.type,
            x: Math.random() * 700 + 50,
            y: -40,
            size: 48,
            speed: selectedSpeed,
            isDragging: false
        });
    }

        closeNicknameModal();
        isSettingsOpen = false;
        isConfirmQuitOpen = false;
        score = 0;
        lives = 3;
        spawnRate = 85;
        frameCount = 0;
        trashes = [];
        draggedTrash = null;
        gameState = 'playing';
    }

    function openTutorial(source = 'fromMenu') {
        isSettingsOpen = false;
        tutorialSource = source;
        if (source === 'firstPlay') {
            hasSeenTutorial = true;
            safeStorageSet('operacaoColetaTutorialSeen', 'true');
        }
        gameState = 'tutorial';
    }

    function handlePlayButtonClick() {
        if (!hasSeenTutorial) {
            openTutorial('firstPlay');
        } else {
            beginMatchDirectly();
        }
    }

    function returnToMenu() {
        isConfirmQuitOpen = false;
        isSettingsOpen = false;
        if (draggedTrash) {
            draggedTrash.isDragging = false;
            draggedTrash = null;
        }
        trashes = [];
        seedBackgroundTrashes();
        gameState = 'menu';
    }

                ctx.lineWidth = 3;
                drawRoundRectSafe(confirmYesBtn.x, confirmYesBtn.y, confirmYesBtn.w, confirmYesBtn.h, 12);
                ctx.fill();

                drawCartoonText(t('yes'), confirmYesBtn.x + confirmYesBtn.w / 2, confirmYesBtn.y + confirmYesBtn.h / 2 + 1, {
                    fontSize: 21,

                    strokeWidth: 4.5,

                ctx.fill();
                ctx.stroke();

                drawCartoonText(t('no'), confirmNoBtn.x + confirmNoBtn.w / 2, confirmNoBtn.y + confirmNoBtn.h / 2 + 1, {
                    fontSize: 21,
                    fillColor: '#ffffff',
                    strokeColor: '#141414',
                    strokeWidth: 4.5,
                    align: 'center',
                    baseline: 'middle'

            }
        }
    }

    function drawGameOverScreen() {
        drawGameBackground();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';

        drawCartoonText(t('gameOverTitle'), 400, 132, {
            fontSize: 36,
            fillColor: '#ffb300',
            strokeColor: '#141414',
            strokeWidth: 5.5,
            align: 'center'
        });

        let infoY = 180;
        if (playerName) {
            drawCartoonText(`${t('playerLabel')}: ${playerName}`, 400, infoY, {
                fontSize: 23,
                fillColor: '#ffffff',
                strokeColor: '#141414',
                strokeWidth: 5,
                align: 'center'
            });
            infoY += 36;
        }

        drawCartoonText(`${t('pointsLabel')}: ${score.toLocaleString('pt-BR')}`, 400, infoY, {
            fontSize: 24,

            align: 'center'
        });

        drawCartoonText(`${t('highScoreLabel')}: ${highScore.toLocaleString('pt-BR')}`, 400, infoY + 38, {

        drawCartoonText(t('playAgain'), retryBtn.x + retryBtn.w / 2, retryBtn.y + retryBtn.h / 2 + 1, {

        ctx.fill();

        drawCartoonText(t('mainMenu'), gameOverMenuBtn.x + gameOverMenuBtn.w / 2, gameOverMenuBtn.y + gameOverMenuBtn.h / 2 + 1, {
            fontSize: 17,
            fillColor: '#ffffff',
            strokeColor: '#141414',
            strokeWidth: 4.5,
            align: 'center',
            baseline: 'middle'
        });
    }

    function getMousePos(evt) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = rect.width > 0 ? canvas.width / rect.width : 1;
        const scaleY = rect.height > 0 ? canvas.height / rect.height : 1;
        const touchObj = (evt.touches && evt.touches[0]) || (evt.changedTouches && evt.changedTouches[0]);
        const clientX = touchObj ? touchObj.clientX : evt.clientX;
        const clientY = touchObj ? touchObj.clientY : evt.clientY;
        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    function isInsideRect(pos, rect) {
        if (!rect) return false;
        return pos.x >= rect.x && pos.x <= rect.x + rect.w && pos.y >= rect.y && pos.y <= rect.y + rect.h;
    }

    function handleStart(evt) {
        if (gameState === 'loading' || isNicknameModalOpen) return;

        const pos = getMousePos(evt);

        if (isSettingsOpen) {
            evt.preventDefault();
            if (isInsideRect(pos, langPtBtn)) {
                setLanguage('pt');
            } else if (isInsideRect(pos, langEnBtn)) {
                setLanguage('en');
            } else if (isInsideRect(pos, langEsBtn)) {
                setLanguage('es');
            } else if (isInsideRect(pos, closeSettingsBtn) || !isInsideRect(pos, settingsBoxRect)) {
                isSettingsOpen = false;
            }
            return;
        }

        if (gameState === 'menu') {
            evt.preventDefault();

            if (isInsideRect(pos, menuHitboxes.jogar)) {
                handlePlayButtonClick();
            } else if (isInsideRect(pos, menuHitboxes.apelido)) {
                openNicknameModal();
            } else if (isInsideRect(pos, menuHitboxes.tutorial)) {
                openTutorial('fromMenu');
            } else if (isInsideRect(pos, menuHitboxes.ranking)) {
                console.log("Botão Ranking clicado (lógica do ranking será adicionada na próxima etapa).");
            } else if (isInsideRect(pos, menuHitboxes.config)) {
                isSettingsOpen = true;
            }
            return;
        }

        if (gameState === 'tutorial') {
            evt.preventDefault();
            if (isInsideRect(pos, tutorialActionBtn)) {
                if (tutorialSource === 'firstPlay') {
                    beginMatchDirectly();
                } else {
                    returnToMenu();
                }
            }
            return;
        }

        if (gameState === 'paused') {
            evt.preventDefault();

            if (!isConfirmQuitOpen) {
                if (isInsideRect(pos, resumeBtn)) {
                    gameState = 'playing';
                } else if (isInsideRect(pos, pauseMenuBtn)) {
                    isConfirmQuitOpen = true;
                }
            } else {
                if (isInsideRect(pos, confirmYesBtn)) {
                    returnToMenu();
                } else if (isInsideRect(pos, confirmNoBtn)) {
                    isConfirmQuitOpen = false;
                }
            }
            return;
        }

        if (gameState === 'gameover') {
            evt.preventDefault();
            if (isInsideRect(pos, retryBtn)) {
                beginMatchDirectly();
            } else if (isInsideRect(pos, gameOverMenuBtn)) {
                returnToMenu();
            }
            return;
        }

        if (gameState === 'playing') {
            evt.preventDefault();

            if (isInsideRect(pos, pauseBtn)) {
                if (draggedTrash) {
                    draggedTrash.isDragging = false;
                    draggedTrash = null;
                }
                isConfirmQuitOpen = false;
                gameState = 'paused';
                return;
            }

            for (let i = trashes.length - 1; i >= 0; i--) {
                let trashItem = trashes[i];
                if (pos.x >= trashItem.x - trashItem.size/2 && pos.x <= trashItem.x + trashItem.size/2 &&
                    pos.y >= trashItem.y - trashItem.size/2 && pos.y <= trashItem.y + trashItem.size/2) {
                    trashItem.isDragging = true;
                    draggedTrash = trashItem;
                    break;
                }
            }
        }
    }

    function handleMove(evt) {
        if (draggedTrash && gameState === 'playing') {
            evt.preventDefault();
            const pos = getMousePos(evt);
            draggedTrash.x = pos.x;
            draggedTrash.y = pos.y;
        }
    }

    function handleEnd(evt) {
        if (draggedTrash && gameState === 'playing') {
            let droppedInBin = false;
            bins.forEach(bin => {
                if (draggedTrash.x >= bin.x && draggedTrash.x <= bin.x + bin.w &&
                    draggedTrash.y >= bin.y && draggedTrash.y <= bin.y + bin.h) {

                    droppedInBin = true;
                    if (draggedTrash.type === bin.type) {
                        score += 50;
                    } else {
                        lives--;
                    }
                }
            });

            if (droppedInBin) {
                trashes = trashes.filter(item => item !== draggedTrash);
            }

            draggedTrash.isDragging = false;
            draggedTrash = null;
        }
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', handleStart, {passive: false});
    canvas.addEventListener('touchmove', handleMove, {passive: false});
    canvas.addEventListener('touchend', handleEnd);

    function drawMenuScreen() {
        drawGameBackground();
        updateDynamicBackground();

        drawImageProportional(
            menuImages.logo,
            0, 0, 275, 175,
            'left', 'top',
            (x, y, w, h) => {
                drawCartoonText(t('gameTitleFallback'), x + 15, y + 50, {
                    fontSize: 26,
                    fillColor: '#ffb300',
                    strokeColor: '#141414',
                    strokeWidth: 5,
                    align: 'left'
                });
            }
        );

        const apelidoBox = drawImageProportional(
            menuImages.apelido,
            800, 0, 260, 90,
            'right', 'top',
            (x, y, w, h) => {
                ctx.fillStyle = '#7cb342';
                ctx.fillRect(x + 12, y + 8, w - 20, h - 18);
                ctx.strokeStyle = '#1b1b1b';
                ctx.lineWidth = 3;
                ctx.strokeRect(x + 12, y + 8, w - 20, h - 18);
            }
        );
        menuHitboxes.apelido = apelidoBox;

        const nicknameLabel = playerName ? playerName : t('defaultNicknameBtn');
        const centerX = apelidoBox.x + apelidoBox.w / 2;
        const centerY = apelidoBox.y + apelidoBox.h / 2 + 1;
        drawCartoonText(nicknameLabel, centerX, centerY, {
            fontSize: 22,
            fillColor: '#ffffff',
            strokeColor: '#141414',
            strokeWidth: 5,
            align: 'center',
            baseline: 'middle',
            maxWidth: apelidoBox.w * 0.62
        });

        // Botão Tutorial médio (64x64 px), em cima
        menuHitboxes.tutorial = menuTutorialBtnRect;
        drawImageProportional(
            menuImages.tutorial,
            menuTutorialBtnRect.x + menuTutorialBtnRect.w / 2,
            menuTutorialBtnRect.y + menuTutorialBtnRect.h / 2,
            menuTutorialBtnRect.w,
            menuTutorialBtnRect.h,
            'center',
            'center',
            (x, y, w, h) => {
                ctx.fillStyle = '#4fc3f7';
                ctx.strokeStyle = '#141414';
                ctx.lineWidth = 3;
                drawRoundRectSafe(x, y, w, h, 12);
                ctx.fill();

                drawCartoonText("?", x + w / 2, y + h / 2 + 1, {

        // Botão Ranking médio (64x64 px), abaixo do Tutorial e alinhado
        menuHitboxes.ranking = menuRankingBtnRect;
        drawImageProportional(

            menuRankingBtnRect.x + menuRankingBtnRect.w / 2,
            menuRankingBtnRect.y + menuRankingBtnRect.h / 2,
            menuRankingBtnRect.w,
            menuRankingBtnRect.h,
            'center',
            'center',
            (x, y, w, h) => {
                ctx.fillStyle = '#ffb300';
                ctx.strokeStyle = '#141414';
                ctx.lineWidth = 3;
                drawRoundRectSafe(x, y, w, h, 12);
                ctx.fill();
                ctx.stroke();
                drawCartoonText(t('rankingFallback'), x + w / 2, y + h / 2 + 1, {
                    fontSize: 18,
                    fillColor: '#ffffff',
                    strokeColor: '#141414',
                    strokeWidth: 4.5,
                    align: 'center',
                    baseline: 'middle'
                });
            }
        );

        // Botão Configurações (54x54 px) no canto inferior esquerdo
        menuHitboxes.config = menuConfigBtnRect;
        drawImageProportional(
            menuImages.config,
            menuConfigBtnRect.x + menuConfigBtnRect.w / 2,
            menuConfigBtnRect.y + menuConfigBtnRect.h / 2,
            menuConfigBtnRect.w,
            menuConfigBtnRect.h,
            'center',
            'center',
            drawGearFallback
        );

        menuHitboxes.jogar = drawImageProportional(
            getPlayButtonAsset(),
            400, 260, 330, 100,
            'center', 'center',
            (x, y, w, h) => {
                ctx.fillStyle = '#7cb342';
                ctx.fillRect(x + 15, y + 10, w - 30, h - 20);
                ctx.strokeStyle = '#1b1b1b';
                ctx.lineWidth = 3;
                ctx.strokeRect(x + 15, y + 10, w - 30, h - 20);
                drawCartoonText(t('playFallback'), x + w / 2, y + h / 2, {
                    fontSize: 26,
                    fillColor: '#ffffff',
                    strokeColor: '#141414',
                    strokeWidth: 4.5,
                    align: 'center',
                    baseline: 'middle'
                });
            }
        );

        drawCartoonText(t('recordLabel'), 785, 352, {
            fontSize: 28,
            fillColor: '#ffffff',
            strokeColor: '#141414',
            strokeWidth: 5.5,
            align: 'right'
        });

        drawCartoonText(highScore.toLocaleString('pt-BR'), 785, 398, {
            fontSize: 36,
            fillColor: '#ffb300',
            strokeColor: '#141414',
            strokeWidth: 5.5,
            align: 'right'
        });

        if (isSettingsOpen) {
            drawSettingsModal();
        }
    }

    function update() {
        try {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'loading') {
                drawLoadingScreen();
            } else if (gameState === 'menu') {
                drawMenuScreen();
            } else if (gameState === 'tutorial') {
                drawTutorialScreen();
            } else if (gameState === 'playing') {
                frameCount++;
                if (frameCount % spawnRate === 0) spawnTrash();

                for (let i = 0; i < trashes.length; i++) {
                    let trashItem = trashes[i];

                    if (!trashItem.isDragging) {
                        trashItem.y += trashItem.speed;
                    }

                    if (!trashItem.isDragging && trashItem.y >= bins[0].y) {
                        let hitBin = null;

                        bins.forEach(bin => {
                            if (trashItem.x >= bin.x && trashItem.x <= bin.x + bin.w &&
                                trashItem.y >= bin.y && trashItem.y <= bin.y + bin.h) {
                                hitBin = bin;
                            }
                        });

                        if (hitBin) {
                            if (trashItem.type === hitBin.type) {
                                score += 50;
                            } else {
                                lives--;
                            }
                            trashes.splice(i, 1);
                            i--;
                        } else if (trashItem.y >= canvas.height) {
                            lives--;
                            trashes.splice(i, 1);
                            i--;
                        }
                    }
                }

                if (lives <= 0) {
                    if (score > highScore) {
                        highScore = score;
                        safeStorageSet('operacaoColetaHighScore', highScore);
                    }
                    gameState = 'gameover';
                } else {
                    drawPlayingScene(false);
                }
            } else if (gameState === 'paused') {
                drawPlayingScene(true);
            } else if (gameState === 'gameover') {
                drawGameOverScreen();
            } else {
                gameState = 'menu';
                drawMenuScreen();
            }

            if (lastErrorMessage) {
                ctx.save();
                ctx.fillStyle = 'rgba(183, 28, 28, 0.85)';
                ctx.fillRect(10, 10, 780, 28);
                ctx.fillStyle = '#ffffff';
                ctx.font = '13px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('Erro: ' + lastErrorMessage, 18, 29);
                ctx.restore();
            }
        } catch (err) {
            lastErrorMessage = err && err.message ? err.message : String(err);
            drawGameBackground();
            drawCartoonText(t('gameTitleFallback'), 400, 180, {
                fontSize: 28,
                fillColor: '#ffb300',
                strokeColor: '#141414',
                strokeWidth: 5
            });
        }

        requestAnimationFrame(update);
    }

    try {
        applyLanguageToDOM();
        seedBackgroundTrashes();
        preloadImages();
    } catch (initErr) {
        lastErrorMessage = initErr && initErr.message ? initErr.message : String(initErr);
        gameState = 'menu';
    }
    update();
});
